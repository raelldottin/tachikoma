name: Repository checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  repository:
    name: Repository and automation harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: python scripts/ci.py repository
      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: python -m unittest automation.tests.test_harness

  lint:
    name: Python lint ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - run: python scripts/ci.py lint
      - run: python -m ruff format --check scripts/ci.py tests/test_ci.py
