name: Daily Automated Actions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'

permissions:
  contents: read

jobs:
  daily-run:
    name: 'Runs daily'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python version 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Process account 1
        if: ${{ !contains(format(',{0},', vars.LEGACY_RUN_SKIP), ',1,') }}
        continue-on-error: true
        env:
          PSS_EMAIL: ${{ secrets.PSS_ACCOUNT_1_EMAIL }}
          PSS_PASSWORD: ${{ secrets.PSS_ACCOUNT_1_PASSWORD }}
          SMTP_EMAIL: ${{ secrets.email_username }}
          SMTP_PASSWORD: ${{ secrets.email_password }}
          RECIPIENT: ${{ secrets.email_recipient }}
        run: |
          set -euo pipefail
          umask 077

          pw_file="$(mktemp)"
          trap 'rm -f "$pw_file"' EXIT
          printf '%s' "$PSS_PASSWORD" > "$pw_file"

          python run.py \
            --login-email "$PSS_EMAIL" \
            --password-file "$pw_file" \
            --smtp-email "$SMTP_EMAIL" \
            --smtp-password-file <(printf '%s' "$SMTP_PASSWORD") \
            --recipient "$RECIPIENT" \
            --run-battle

