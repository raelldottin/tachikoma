name: Daily Automated Actions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  daily-run:
    name: 'Runs daily'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git checkout HEAD^2
        if: ${{ github.event_name == 'pull_request' }}
      - name: Setup Python version 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Provision account secrets
        env:
          PSS_ACCOUNT_1_EMAIL: ${{ secrets.PSS_ACCOUNT_1_EMAIL }}
          PSS_ACCOUNT_1_PASSWORD: ${{ secrets.PSS_ACCOUNT_1_PASSWORD }}
          PSS_ACCOUNT_1_REFRESH_TOKEN: ${{ secrets.PSS_ACCOUNT_1_REFRESH_TOKEN }}
          PSS_ACCOUNT_2_EMAIL: ${{ secrets.PSS_ACCOUNT_2_EMAIL }}
          PSS_ACCOUNT_2_PASSWORD: ${{ secrets.PSS_ACCOUNT_2_PASSWORD }}
          PSS_ACCOUNT_2_REFRESH_TOKEN: ${{ secrets.PSS_ACCOUNT_2_REFRESH_TOKEN }}
          PSS_ACCOUNT_3_EMAIL: ${{ secrets.PSS_ACCOUNT_3_EMAIL }}
          PSS_ACCOUNT_3_PASSWORD: ${{ secrets.PSS_ACCOUNT_3_PASSWORD }}
          PSS_ACCOUNT_3_REFRESH_TOKEN: ${{ secrets.PSS_ACCOUNT_3_REFRESH_TOKEN }}
          PSS_ACCOUNT_4_EMAIL: ${{ secrets.PSS_ACCOUNT_4_EMAIL }}
          PSS_ACCOUNT_4_PASSWORD: ${{ secrets.PSS_ACCOUNT_4_PASSWORD }}
          PSS_ACCOUNT_4_REFRESH_TOKEN: ${{ secrets.PSS_ACCOUNT_4_REFRESH_TOKEN }}
          PSS_ACCOUNT_5_EMAIL: ${{ secrets.PSS_ACCOUNT_5_EMAIL }}
          PSS_ACCOUNT_5_PASSWORD: ${{ secrets.PSS_ACCOUNT_5_PASSWORD }}
          PSS_ACCOUNT_5_REFRESH_TOKEN: ${{ secrets.PSS_ACCOUNT_5_REFRESH_TOKEN }}
        run: |
          mkdir -p runner_auths
          python scripts/provision_account_secrets.py --output-dir runner_auths
      - name: Process account 1
        env:
          AUTH_STRING: ${{ secrets.auth_string_first }}
          SMTP_EMAIL: ${{ secrets.email_username }}
          SMTP_PASSWORD: ${{ secrets.email_password }}
          RECIPIENT: ${{ secrets.email_recipient }}
        run: |
          set -euo pipefail
          umask 077

          auth_file="$(mktemp)"
          smtp_password_file="$(mktemp)"
          trap 'rm -f "$auth_file" "$smtp_password_file"' EXIT

          if [ -f "runner_auths/auth_1.txt" ]; then
            cp "runner_auths/auth_1.txt" "$auth_file"
          else
            printf '%s' "$AUTH_STRING" > "$auth_file"
          fi
          printf '%s' "$SMTP_PASSWORD" > "$smtp_password_file"

          python run.py \
            --auth-file "$auth_file" \
            --smtp-email "$SMTP_EMAIL" \
            --smtp-password-file "$smtp_password_file" \
            --recipient "$RECIPIENT" \
            --battles 10

      - name: Process account 2
        if: ${{ !cancelled() }}
        env:
          AUTH_STRING: ${{ secrets.auth_string_second }}
          SMTP_EMAIL: ${{ secrets.email_username }}
          SMTP_PASSWORD: ${{ secrets.email_password }}
          RECIPIENT: ${{ secrets.email_recipient }}
        run: |
          set -euo pipefail
          umask 077

          auth_file="$(mktemp)"
          smtp_password_file="$(mktemp)"
          trap 'rm -f "$auth_file" "$smtp_password_file"' EXIT

          if [ -f "runner_auths/auth_1.txt" ]; then
            cp "runner_auths/auth_1.txt" "$auth_file"
          else
            printf '%s' "$AUTH_STRING" > "$auth_file"
          fi
          printf '%s' "$SMTP_PASSWORD" > "$smtp_password_file"

          python run.py \
            --auth-file "$auth_file" \
            --smtp-email "$SMTP_EMAIL" \
            --smtp-password-file "$smtp_password_file" \
            --recipient "$RECIPIENT" \
            --battles 10

      - name: Process account 3
        if: ${{ !cancelled() }}
        env:
          AUTH_STRING: ${{ secrets.auth_string_third }}
          SMTP_EMAIL: ${{ secrets.email_username }}
          SMTP_PASSWORD: ${{ secrets.email_password }}
          RECIPIENT: ${{ secrets.email_recipient }}
        run: |
          set -euo pipefail
          umask 077

          auth_file="$(mktemp)"
          smtp_password_file="$(mktemp)"
          trap 'rm -f "$auth_file" "$smtp_password_file"' EXIT

          if [ -f "runner_auths/auth_1.txt" ]; then
            cp "runner_auths/auth_1.txt" "$auth_file"
          else
            printf '%s' "$AUTH_STRING" > "$auth_file"
          fi
          printf '%s' "$SMTP_PASSWORD" > "$smtp_password_file"

          python run.py \
            --auth-file "$auth_file" \
            --smtp-email "$SMTP_EMAIL" \
            --smtp-password-file "$smtp_password_file" \
            --recipient "$RECIPIENT" \
            --battles 10

      - name: Process account 4
        if: ${{ !cancelled() }}
        env:
          AUTH_STRING: ${{ secrets.auth_string_fourth }}
          SMTP_EMAIL: ${{ secrets.email_username }}
          SMTP_PASSWORD: ${{ secrets.email_password }}
          RECIPIENT: ${{ secrets.email_recipient }}
        run: |
          set -euo pipefail
          umask 077

          auth_file="$(mktemp)"
          smtp_password_file="$(mktemp)"
          trap 'rm -f "$auth_file" "$smtp_password_file"' EXIT

          if [ -f "runner_auths/auth_1.txt" ]; then
            cp "runner_auths/auth_1.txt" "$auth_file"
          else
            printf '%s' "$AUTH_STRING" > "$auth_file"
          fi
          printf '%s' "$SMTP_PASSWORD" > "$smtp_password_file"

          python run.py \
            --auth-file "$auth_file" \
            --smtp-email "$SMTP_EMAIL" \
            --smtp-password-file "$smtp_password_file" \
            --recipient "$RECIPIENT" \
            --battles 10

      - name: Process account 5
        if: ${{ !cancelled() }}
        env:
          AUTH_STRING: ${{ secrets.auth_string_fifth }}
          SMTP_EMAIL: ${{ secrets.email_username }}
          SMTP_PASSWORD: ${{ secrets.email_password }}
          RECIPIENT: ${{ secrets.email_recipient }}
        run: |
          set -euo pipefail
          umask 077

          auth_file="$(mktemp)"
          smtp_password_file="$(mktemp)"
          trap 'rm -f "$auth_file" "$smtp_password_file"' EXIT

          if [ -f "runner_auths/auth_1.txt" ]; then
            cp "runner_auths/auth_1.txt" "$auth_file"
          else
            printf '%s' "$AUTH_STRING" > "$auth_file"
          fi
          printf '%s' "$SMTP_PASSWORD" > "$smtp_password_file"

          python run.py \
            --auth-file "$auth_file" \
            --smtp-email "$SMTP_EMAIL" \
            --smtp-password-file "$smtp_password_file" \
            --recipient "$RECIPIENT" \
            --battles 10
