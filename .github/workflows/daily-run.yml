name: Daily Automated Actions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'

jobs:
  daily-run:
    name: 'Runs daily'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git checkout HEAD^2
        if: ${{ github.event_name == 'pull_request' }}
      - name: Setup Python version 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Process account 1
        continue-on-error: true
        env:
          PSS_EMAIL: ${{ secrets.PSS_ACCOUNT_1_EMAIL }}
          PSS_PASSWORD: ${{ secrets.PSS_ACCOUNT_1_PASSWORD }}
          SMTP_EMAIL: ${{ secrets.email_username }}
          SMTP_PASSWORD: ${{ secrets.email_password }}
          RECIPIENT: ${{ secrets.email_recipient }}
        run: |
          set -euo pipefail
          umask 077

          pw_file="$(mktemp)"
          trap 'rm -f "$pw_file"' EXIT
          printf '%s' "$PSS_PASSWORD" > "$pw_file"

          python run.py \
            --login-email "$PSS_EMAIL" \
            --password-file "$pw_file" \
            --smtp-email "$SMTP_EMAIL" \
            --smtp-password-file <(printf '%s' "$SMTP_PASSWORD") \
            --recipient "$RECIPIENT" \
            --run-battle

      - name: Process account 2
        continue-on-error: true
        env:
          PSS_EMAIL: ${{ secrets.PSS_ACCOUNT_2_EMAIL }}
          PSS_PASSWORD: ${{ secrets.PSS_ACCOUNT_2_PASSWORD }}
