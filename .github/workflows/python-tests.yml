name: Python tests

on:
  workflow_call:
    inputs:
      operating-systems:
        type: string
        default: '["ubuntu-latest"]'
      python-versions:
        type: string
        default: '["3.13"]'

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.operating-systems) }}
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: Full mocked application suite
        if: runner.os != 'Windows'
        run: python scripts/ci.py test
      - name: Portable Windows smoke suite
        if: runner.os == 'Windows'
        run: >-
          python scripts/ci.py test --names
          tests.test_security
          tests.test_game_formulas
          tests.test_crew_leveling
          tests.test_ship_layout
          tests.test_ci

  mutation:
    name: Mutation score (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory: a job timeout or a failed setup step must not fail this reusable workflow or `CI required`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      # Exit 1 (a score below min_score) becomes a warning annotation; exit 2 (config, baseline or harness error)
      # an error annotation, so a broken harness stays visible. Neither can fail `CI required`.
      - name: Mutation testing (non-blocking)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          status=0
          python scripts/mutation.py --jobs 4 || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning title=Mutation score::a target scored below its min_score (advisory)"
          elif [ "$status" -ne 0 ]; then
            echo "::error title=Mutation harness::scripts/mutation.py exited $status (config, baseline or harness error)"
          fi
          exit "$status"
