name: Python tests

on:
  workflow_call:
    inputs:
      operating-systems:
        type: string
        default: '["ubuntu-latest"]'
      python-versions:
        type: string
        default: '["3.13"]'
      # Only Blocking CI sets this; post-merge and release runs skip both mutation jobs.
      run-mutation:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.operating-systems) }}
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: Full mocked application suite
        if: runner.os != 'Windows'
        run: python scripts/ci.py test
      - name: Portable Windows smoke suite
        if: runner.os == 'Windows'
        run: >-
          python scripts/ci.py test --names
          tests.test_security
          tests.test_game_formulas
          tests.test_crew_leveling
          tests.test_ship_layout
          tests.test_ci

  mutation:
    name: Mutation score (advisory)
    if: ${{ inputs.run-mutation }}
    runs-on: ubuntu-latest
    # Every target outside sdk/training/ (those block merges in mutation-gate below). The mutation step carries
    # continue-on-error and times out (15 minutes) before the job does, so a low score, a harness error or a slow
    # run is reported without failing this reusable workflow or `CI required`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      # Exit 1 (a score below min_score) becomes a warning annotation; exit 2 (config, baseline or harness error)
      # an error annotation, so a broken harness stays visible. Neither can fail `CI required`.
      - name: Mutation testing (non-blocking)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          status=0
          config="$RUNNER_TEMP/mutation-advisory.json"
          python scripts/ci.py mutation-config --advisory > "$config" || status=2
          if [ "$status" -eq 0 ]; then
            python scripts/mutation.py --config "$config" --jobs 4 --json mutation.json --summary "$GITHUB_STEP_SUMMARY" || status=$?
          fi
          if [ "$status" -eq 1 ]; then
            echo "::warning title=Mutation score::a target scored below its min_score (advisory)"
          elif [ "$status" -ne 0 ]; then
            echo "::error title=Mutation harness::scripts/mutation.py exited $status (config, baseline or harness error)"
          fi
          exit "$status"
      # The JSON report (every mutant, its status and survivor diffs) outlives the runner, also after a failed
      # mutation step; a failed upload cannot fail the job either.
      - name: Upload mutation report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ github.run_attempt }}
          path: mutation.json
          retention-days: 14
          if-no-files-found: ignore

  mutation-gate:
    name: Mutation gate (sdk/training, blocking)
    if: ${{ inputs.run-mutation }}
    runs-on: ubuntu-latest
    # No continue-on-error: a training target below its min_score (exit 1) or a config, baseline or harness error
    # (exit 2) fails this job, the reusable workflow and `CI required`. The step times out before the job does.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      # scripts/ci.py refuses a config that dropped a training target, unmapped its tests or cut its floor below 0.90.
      - name: Mutation testing (blocking)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/mutation-blocking.json"
          python scripts/ci.py mutation-config --blocking > "$config"
          python scripts/mutation.py --config "$config" --jobs 4 --json mutation-gate.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload mutation gate report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-gate-report-${{ github.run_attempt }}
          path: mutation-gate.json
          retention-days: 14
          if-no-files-found: ignore

  training-benchmark:
    name: Crew-training benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt
      # Blocking: composite and per-scenario (three-seed mean) scores at or above baseline.json exactly, zero findings
      # from the nine policy oracles, no scenario errors, and byte-identical output on an in-process rerun and in a
      # child process under another PYTHONHASHSEED (about 5 s).
      # Double quotes: the shell expands the summary path.
      - name: Benchmark gate
        run: make training-benchmark ARGS="--gate --json training-benchmark.json --summary $GITHUB_STEP_SUMMARY"
      - name: Upload benchmark report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: training-benchmark-${{ github.run_attempt }}
          path: training-benchmark.json
          retention-days: 14
          if-no-files-found: ignore
