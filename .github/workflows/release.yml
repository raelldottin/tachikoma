name: Source release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/automation-check.yml
  tests:
    uses: ./.github/workflows/python-tests.yml
    with:
      operating-systems: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      python-versions: '["3.11", "3.13"]'

  build:
    needs: [checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate tag and build reproducible source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/ci.py release --tag "$RELEASE_TAG" --main-ref origin/main --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Prepare draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-release
          path: dist
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
