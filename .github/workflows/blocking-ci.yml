name: Blocking CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blocking-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/automation-check.yml
  tests:
    uses: ./.github/workflows/python-tests.yml

  required:
    name: CI required
    if: ${{ always() }}
    needs: [checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require every upstream result to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci.py gate --required checks tests
