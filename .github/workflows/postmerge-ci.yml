name: Post-merge CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postmerge-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/automation-check.yml
  tests:
    uses: ./.github/workflows/python-tests.yml
    with:
      operating-systems: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      python-versions: '["3.11", "3.13"]'

  required:
    name: Post-merge result
    if: ${{ always() }}
    needs: [checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci.py gate --required checks tests
