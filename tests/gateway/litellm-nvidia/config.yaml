# config.yaml — LiteLLM proxy config for the acceptance test run.
# One model alias backed by three mock "NVIDIA" credentials. Real run would use
#   model: nvidia_nim/z-ai/glm-5.3
#   api_base: https://integrate.api.nvidia.com/v1

model_list:
  - model_name: nvidia-primary
    litellm_params:
      model: openai/z-ai/glm-5.3
      api_base: http://127.0.0.1:43210/v1
      api_key: os.environ/NVIDIA_KEY_1
      weight: 1

  - model_name: nvidia-primary
    litellm_params:
      model: openai/z-ai/glm-5.3
      api_base: http://127.0.0.1:43210/v1
      api_key: os.environ/NVIDIA_KEY_2
      weight: 1

  - model_name: nvidia-primary
    litellm_params:
      model: openai/z-ai/glm-5.3
      api_base: http://127.0.0.1:43210/v1
      api_key: os.environ/NVIDIA_KEY_3
      weight: 1

router_settings:
  routing_strategy: simple-shuffle
  enabled: true
  allowed_fails: 3
  cooldown_time: 2

litellm_settings:
  num_retries: 2

general_settings:
  master_key: os.environ/GATEWAY_MASTER_KEY  # export GATEWAY_MASTER_KEY=sk-gateway-test-key for local runs
