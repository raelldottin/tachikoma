# TPM-only multi-process config (T3 phase of test_rpm_tpm_multiprocess.py).
# Identical topology to config-rpmtpm.yaml but only tpm set, low, so a few
# large-input requests exhaust the aggregate budget.
#
# Requires env: NVIDIA_KEY_1/2, GATEWAY_MASTER_KEY, REDIS_HOST, REDIS_PORT.

model_list:
  - model_name: nvidia-primary
    litellm_params:
      model: openai/z-ai/glm-5.3
      api_base: http://127.0.0.1:43210/v1
      api_key: os.environ/NVIDIA_KEY_1
      tpm: 500
      weight: 1
  - model_name: nvidia-primary
    litellm_params:
      model: openai/z-ai/glm-5.3
      api_base: http://127.0.0.1:43210/v1
      api_key: os.environ/NVIDIA_KEY_2
      tpm: 500
      weight: 1

router_settings:
  routing_strategy: simple-shuffle
  optional_pre_call_checks: ["enforce_model_rate_limits"]   # opt-in: activates tpm enforcement
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

litellm_settings:
  num_retries: 0

general_settings:
  master_key: os.environ/GATEWAY_MASTER_KEY
